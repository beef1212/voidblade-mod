
name: Build Voidblade Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check project files
        run: |
          echo "Repository root:"
          pwd
          echo "Gradle files:"
          find . -maxdepth 6 -type f \( -name build.gradle -o -name settings.gradle \)

      - name: Build mod
        working-directory: voidblade-github-actions-build/voidblade-mod
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: voidblade-mod-jar
          path: voidblade-github-actions-build/voidblade-mod/build/libs/*.jar
          if-no-files-found: error
